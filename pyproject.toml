[project]
name = "grounded-notes"
version = "0.1.0"
description = "Grounded RAG knowledge assistant: cited, hallucination-resistant answers over a document corpus"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "chromadb>=1.5.9",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-frontmatter>=1.3.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sentence-transformers>=5.6.0",
    "streamlit>=1.59.1",
    "torch>=2.13.0",
    "typer>=0.26.8",
]

[project.scripts]
ragkit = "ragkit.cli:app"

[project.optional-dependencies]
cloud = [
    "anthropic>=0.116.0",
    "openai>=2.45.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ragkit"]

# Embeddings run on CPU by design; without this, Linux installs pull the
# full CUDA stack (~3 GB) for nothing.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]

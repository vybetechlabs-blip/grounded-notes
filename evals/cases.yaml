# Eval cases: question -> expected source documents.
#
# `expected_sources`: retrieval hits if ANY listed source appears in the
# top-k citations (some questions are legitimately answered by two docs).
# `answerable: false` cases MUST be refused by the grounding guard —
# that metric is expected to stay at 100%.

